listen=YES
listen_ipv6=NO
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
file_open_mode=0666
chroot_local_user=YES
local_root=/srv/ftp
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.allowed_users
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
pasv_addr_resolve=YES
port_enable=NO
ssl_enable=YES
allow_anon_ssl=NO
force_local_logins_ssl=YES
force_local_data_ssl=YES
ssl_sslv2=NO
ssl_sslv3=NO
ssl_tlsv1=YES
ssl_ciphers=HIGH:!aNULL:!MD5:!3DES
require_ssl_reuse=NO
rsa_cert_file=/etc/vsftpd/tls/server.crt
rsa_private_key_file=/etc/vsftpd/tls/server.key
xferlog_enable=YES
xferlog_std_format=NO
vsftpd_log_file=/dev/stdout
seccomp_sandbox=NO
hide_ids=YES
max_clients=10
max_per_ip=5
idle_session_timeout=600
data_connection_timeout=300
